<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>आँगन • Aangan</title>
  <meta name="description" content="A quiet digital courtyard. A soft place to sit when the world feels a little too loud." />
  <meta name="theme-color" content="#0c0a09" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; background: #0c0a09; color: #f5f0e8; user-select: none; }
    .scene { position: fixed; inset: 0; overflow: hidden; }
    .bg { position: absolute; inset: 0; background-image: url('aangan-bg-desktop.jpg'); background-size: cover; background-position: center 45%; background-repeat: no-repeat; transform: scale(1.04); transition: transform 12s ease, filter 2.8s ease; will-change: transform, filter; }
    .bg.settled { transform: scale(1); }
    @media (max-width: 700px) { .bg { background-image: url('aangan-bg-mobile.jpg'); background-position: center center; transform: scale(1.03); } .bg.settled { transform: scale(1); } }
    .sky-tint { position: absolute; inset: 0; pointer-events: none; z-index: 2; transition: background 2.8s ease, opacity 2.8s ease; mix-blend-mode: soft-light; }
    .ground-mask { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: linear-gradient(to top, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.15) 40%, transparent 100%); pointer-events: none; z-index: 3; transition: opacity 2.5s ease; }
    .stars { position: absolute; top: 0; left: 0; right: 0; height: 48%; pointer-events: none; z-index: 4; opacity: 0; transition: opacity 3s ease; overflow: hidden; }
    body.time-night .stars { opacity: 1; }
    .star { position: absolute; background: #fff; border-radius: 50%; opacity: 0; animation: twinkle ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.1; transform: scale(0.7); } 50% { opacity: 0.85; transform: scale(1.15); } }
    body.time-sunrise .sky-tint { background: linear-gradient(to bottom, rgba(255, 170, 120, 0.55) 0%, rgba(255, 200, 150, 0.25) 30%, transparent 60%); mix-blend-mode: soft-light; }
    body.time-sunrise .bg { filter: brightness(1.08) saturate(1.12) hue-rotate(-6deg); }
    body.time-sunrise .ground-mask { opacity: 0.7; }
    body.time-afternoon .sky-tint { background: linear-gradient(to bottom, rgba(140, 200, 255, 0.35) 0%, rgba(200, 230, 255, 0.12) 35%, transparent 65%); }
    body.time-afternoon .bg { filter: brightness(1.15) saturate(1.05) contrast(1.04); }
    body.time-afternoon .ground-mask { opacity: 0.45; }
    body.time-sunset .sky-tint { background: linear-gradient(to bottom, rgba(255, 130, 70, 0.5) 0%, rgba(255, 170, 90, 0.22) 28%, transparent 60%); }
    body.time-sunset .bg { filter: brightness(0.97) saturate(1.18) hue-rotate(4deg); }
    body.time-sunset .ground-mask { opacity: 0.65; }
    body.time-night .sky-tint { background: linear-gradient(to bottom, rgba(8, 12, 35, 0.75) 0%, rgba(5, 10, 28, 0.4) 40%, transparent 70%); mix-blend-mode: multiply; }
    body.time-night .bg { filter: brightness(0.58) saturate(0.7) contrast(1.08); }
    body.time-night .ground-mask { opacity: 0.85; background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.2) 50%, transparent 100%); }
    body.time-night.raining .bg { filter: brightness(0.5) saturate(0.6); }
    .vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.6) 100%); pointer-events: none; z-index: 5; }
    .grain { position: fixed; inset: 0; opacity: 0.035; pointer-events: none; z-index: 6; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
    .rain-container { position: fixed; inset: 0; pointer-events: none; z-index: 7; opacity: 0; transition: opacity 1.2s ease; overflow: hidden; }
    .rain-container.active { opacity: 1; }
    .drop { position: absolute; width: 1px; background: linear-gradient(to bottom, transparent, rgba(200, 220, 255, 0.32)); border-radius: 0 0 2px 2px; animation: fall linear infinite; }
    @keyframes fall { 0% { transform: translateY(-20px); opacity: 0; } 10% { opacity: 0.55; } 90% { opacity: 0.35; } 100% { transform: translateY(100vh); opacity: 0; } }
    .title-area { position: fixed; top: 11%; left: 50%; transform: translateX(-50%); text-align: center; z-index: 20; opacity: 0; animation: fadeInTitle 2.5s ease 0.6s forwards; }
    .main-title { font-family: 'Tiro Devanagari Hindi', serif; font-size: clamp(3.1rem, 8vw, 5.2rem); font-weight: 400; letter-spacing: 0.02em; text-shadow: 0 4px 40px rgba(0,0,0,0.7); margin-bottom: 8px; }
    .sub { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.05rem; opacity: 0.55; letter-spacing: 0.04em; }
    .time-label { margin-top: 10px; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.32; }
    .presence { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
    .soft-light { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 14px 5px rgba(251, 191, 36, 0.3); opacity: 0; animation: breathe 8s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.12; transform: scale(0.85); } 50% { opacity: 0.5; transform: scale(1.1); } }
    .thought-area { position: fixed; bottom: 11%; left: 50%; transform: translateX(-50%); width: min(400px, 88vw); z-index: 20; opacity: 0; animation: fadeIn 2s ease 1.6s forwards; }
    .thought-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; padding: 14px 18px; color: #f5f0e8; font-size: 0.95rem; font-family: inherit; outline: none; resize: none; backdrop-filter: blur(12px); transition: border-color 0.3s; line-height: 1.5; }
    .thought-input::placeholder { color: rgba(245, 240, 232, 0.35); }
    .thought-input:focus { border-color: rgba(251, 191, 36, 0.28); }
    .thought-hint { font-size: 0.72rem; opacity: 0.32; text-align: center; margin-top: 9px; letter-spacing: 0.03em; }
    .thoughts { position: fixed; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; }
    .floating-thought { position: absolute; max-width: 260px; padding: 10px 14px; background: rgba(0,0,0,0.42); backdrop-filter: blur(10px); border-radius: 12px; font-size: 0.82rem; line-height: 1.45; color: rgba(245, 240, 232, 0.75); opacity: 0; animation: thoughtAppear 12s ease forwards; border: 1px solid rgba(255,255,255,0.05); }
    @keyframes thoughtAppear { 0% { opacity: 0; transform: translateY(12px); } 8% { opacity: 0.7; transform: translateY(0); } 80% { opacity: 0.55; } 100% { opacity: 0; transform: translateY(-8px); } }
    .footer-note { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; opacity: 0.25; letter-spacing: 0.08em; z-index: 10; }
    .controls { position: fixed; top: 24px; right: 24px; z-index: 30; display: flex; gap: 10px; }
    .control-btn { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.1); color: rgba(245, 240, 232, 0.6); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.3s ease; font-size: 16px; }
    .control-btn:hover { background: rgba(0,0,0,0.5); color: #f5f0e8; }
    .control-btn.on { color: #7dd3fc; border-color: rgba(125, 211, 252, 0.35); }
    .control-btn.sound-on { color: #fbbf24; border-color: rgba(251, 191, 36, 0.3); }
    #yt-player { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; bottom: 0; left: 0; z-index: -1; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes fadeInTitle { from { opacity: 0; transform: translateX(-50%) translateY(16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @media (max-width: 600px) { .main-title { font-size: 2.9rem; } .thought-area { bottom: 9%; } .controls { top: 16px; right: 16px; gap: 8px; } .control-btn { width: 38px; height: 38px; font-size: 15px; } .stars { height: 42%; } }
  </style>
</head>
<body>
  <div class="scene">
    <div class="bg" id="bg"></div>
    <div class="sky-tint" id="skyTint"></div>
    <div class="stars" id="stars"></div>
    <div class="ground-mask"></div>
  </div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="rain-container" id="rainContainer"></div>
  <div id="yt-player"></div>

  <div class="controls">
    <button class="control-btn" id="rainToggle" title="Toggle rain"><span>🌧️</span></button>
    <button class="control-btn" id="soundToggle" title="Play soft music"><span id="soundIcon">🔇</span></button>
  </div>

  <div class="title-area">
    <div class="main-title">आँगन</div>
    <div class="sub">a quiet courtyard</div>
    <div class="time-label" id="timeLabel"></div>
  </div>

  <div class="presence" id="presence"></div>
  <div class="thoughts" id="thoughts"></div>

  <div class="thought-area">
    <textarea class="thought-input" id="thoughtInput" rows="2" maxlength="140" placeholder="leave a quiet thought here..."></textarea>
    <div class="thought-hint">anonymous · disappears after a while</div>
  </div>

  <div class="footer-note">you are not alone here</div>

  <script>
    function getTimeOfDay() {
      const hour = new Date().getHours();
      if (hour >= 5 && hour < 8) return 'sunrise';
      if (hour >= 8 && hour < 16) return 'afternoon';
      if (hour >= 16 && hour < 19) return 'sunset';
      return 'night';
    }
    const timeLabels = { sunrise: 'sunrise', afternoon: 'afternoon', sunset: 'sunset', night: 'night' };
    function applyTimeOfDay() {
      const time = getTimeOfDay();
      document.body.classList.remove('time-sunrise', 'time-afternoon', 'time-sunset', 'time-night');
      document.body.classList.add('time-' + time);
      document.getElementById('timeLabel').textContent = timeLabels[time];
    }
    applyTimeOfDay();
    setInterval(applyTimeOfDay, 10 * 60 * 1000);

    function createStars() {
      const container = document.getElementById('stars');
      container.innerHTML = '';
      const count = window.innerWidth < 600 ? 38 : 60;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = (Math.random() * 6) + 's';
        star.style.animationDuration = (3.5 + Math.random() * 4) + 's';
        const size = 1 + Math.random() * 1.6;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        container.appendChild(star);
      }
    }
    createStars();

    const bg = document.getElementById('bg');
    const stars = document.getElementById('stars');
    let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      targetX = x * 8;
      targetY = y * 5;
    });
    function animateParallax() {
      currentX += (targetX - currentX) * 0.04;
      currentY += (targetY - currentY) * 0.04;
      bg.style.transform = `scale(${document.body.classList.contains('settled') ? 1 : 1.04}) translate(${currentX * 0.3}px, ${currentY * 0.3}px)`;
      stars.style.transform = `translate(${currentX * 0.7}px, ${currentY * 0.5}px)`;
      requestAnimationFrame(animateParallax);
    }
    if (window.innerWidth > 700) animateParallax();

    const rainContainer = document.getElementById('rainContainer');
    const rainToggle = document.getElementById('rainToggle');
    let rainOn = false;
    function createRain() {
      rainContainer.innerHTML = '';
      const count = window.innerWidth < 600 ? 50 : 85;
      for (let i = 0; i < count; i++) {
        const drop = document.createElement('div');
        drop.className = 'drop';
        drop.style.left = Math.random() * 100 + '%';
        drop.style.height = (11 + Math.random() * 16) + 'px';
        drop.style.animationDuration = (0.7 + Math.random() * 0.85) + 's';
        drop.style.animationDelay = (Math.random() * 4) + 's';
        rainContainer.appendChild(drop);
      }
    }
    function enableRain() {
      rainOn = true; rainToggle.classList.add('on'); rainContainer.classList.add('active');
      document.body.classList.add('raining'); createRain();
    }
    function disableRain() {
      rainOn = false; rainToggle.classList.remove('on'); rainContainer.classList.remove('active');
      document.body.classList.remove('raining');
    }
    rainToggle.addEventListener('click', () => { if (rainOn) disableRain(); else enableRain(); });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (rainOn) createRain(); createStars(); }, 300);
    });

    let player = null, soundOn = false;
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '1', width: '1', videoId: 'uAJ9Qv7VqhQ',
        playerVars: { listType: 'playlist', list: 'PLgsOOZkvTXhcwYc8xK6zLeF_rYSIuUPz4', autoplay: 0, controls: 0, disablekb: 1, fs: 0, modestbranding: 1, rel: 0, loop: 1, playsinline: 1 },
        events: { onStateChange: function(e) { if (e.data === YT.PlayerState.ENDED && soundOn) player.playVideo(); } }
      });
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
    function enableSound() {
      if (!player || typeof player.playVideo !== 'function') { setTimeout(enableSound, 400); return; }
      soundOn = true; soundIcon.textContent = '🔊'; soundToggle.classList.add('sound-on');
      player.unMute(); player.setVolume(45); player.playVideo();
    }
    function disableSound() {
      soundOn = false; soundIcon.textContent = '🔇'; soundToggle.classList.remove('sound-on');
      if (player && typeof player.pauseVideo === 'function') player.pauseVideo();
    }
    soundToggle.addEventListener('click', () => { if (soundOn) disableSound(); else enableSound(); });

    const presence = document.getElementById('presence');
    [{ top: '62%', left: '18%' }, { top: '68%', left: '82%' }, { top: '55%', left: '12%' }, { top: '72%', left: '70%' }].forEach((pos, i) => {
      const light = document.createElement('div');
      light.className = 'soft-light'; light.style.top = pos.top; light.style.left = pos.left; light.style.animationDelay = (i * 1.6) + 's';
      presence.appendChild(light);
    });

    const thoughtInput = document.getElementById('thoughtInput');
    const thoughtsContainer = document.getElementById('thoughts');
    let savedThoughts = JSON.parse(localStorage.getItem('aangan-thoughts') || '[]');
    function showThought(text, isNew = false) {
      const el = document.createElement('div');
      el.className = 'floating-thought'; el.textContent = text;
      el.style.top = (28 + Math.random() * 32) + '%'; el.style.left = (8 + Math.random() * 70) + '%';
      if (isNew) el.style.animationDuration = '14s';
      thoughtsContainer.appendChild(el); setTimeout(() => el.remove(), 14000);
    }
    if (savedThoughts.length === 0) savedThoughts = ["just sitting for a bit", "the evening feels soft today", "missing home a little", "this is enough for now"];
    setTimeout(() => { if (savedThoughts.length) showThought(savedThoughts[Math.floor(Math.random() * savedThoughts.length)]); }, 4000);
    setInterval(() => { if (savedThoughts.length) showThought(savedThoughts[Math.floor(Math.random() * savedThoughts.length)]); }, 16000);
    thoughtInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = thoughtInput.value.trim();
        if (text.length < 2) return;
        showThought(text, true);
        savedThoughts.unshift(text);
        if (savedThoughts.length > 12) savedThoughts.pop();
        localStorage.setItem('aangan-thoughts', JSON.stringify(savedThoughts));
        thoughtInput.value = ''; thoughtInput.blur();
      }
    });

    setTimeout(() => {
      document.getElementById('bg').classList.add('settled');
      document.body.classList.add('settled');
    }, 800);
  </script>
</body>
</html>
